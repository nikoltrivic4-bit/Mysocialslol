<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Your Links</title>
  <meta name="description" content="My social links">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <header class="profile">
      <button class="share" id="shareBtn" aria-label="Share page">↗</button>
      <img src="profile.png" alt="Profile picture" class="avatar" id="avatar">
      <h1 id="username">@yourusername</h1>
      <p id="bio">My social links :)</p>
    </header>

    <section class="links" id="links"></section>
    <footer>Made with your own link page</footer>
  </main>

  <div class="toast" id="toast"></div>
  <script src="script.js"></script>
</body>
</html>
